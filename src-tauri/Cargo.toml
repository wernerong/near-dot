[package]
name = "near-dot"
version = "1.0.3"
description = "Independent local launcher for your existing dot"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[lib]
name = "near_dot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Owner-approved Mac proof only; excluded from public installers.
private-relay = []

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-updater = "=2.13.1"
tauri-plugin-dialog = "=2.8.1"
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
tempfile = "=3.27.0"
semver = "=1.0.28"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "=1.53.2", features = ["sync", "time"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
minisign-verify = "=0.2.5"

[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"

[dev-dependencies]
tauri = { version = "=2.12.1", features = ["test"] }
minisign = "=0.10.0"
